[package]
name = "omacloud-net"
description = "The Omacloud network: storage held by untrusted Omarchy computers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
omacloud-core.workspace = true
base64.workspace = true
sha2.workspace = true
ureq = { version = "3.4.2", features = ["json"] }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
hex = { workspace = true, features = ["serde"] }
rand.workspace = true
blake3 = "1.8"
reed-solomon-simd = "3.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# rng: blinding drawn from a seed, so an exchange asked again asks the same
chacha20 = { version = "0.10", features = ["xchacha", "rng"] }
blind-rsa-signatures = "0.18"
# no port mapping: a node doesn't ask the router to open ports for it
iroh = { version = "1.3", default-features = false, features = ["tls-ring"] }
iroh-blobs = { version = "0.103", default-features = false, features = ["fs-store"] }
tokio = { workspace = true, features = ["macros", "io-util", "time", "sync", "rt-multi-thread"] }
bytes = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
log.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
# a relay server to test relay-only traffic against
iroh = { version = "1.3", default-features = false, features = ["tls-ring", "test-utils"] }
ed25519-dalek.workspace = true
# the transport rustic_backend brings in production
opendal = { workspace = true, features = ["http-transport-reqwest"] }
tempfile.workspace = true
