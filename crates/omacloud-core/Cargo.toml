[package]
name = "omacloud-core"
description = "Omacloud sync engine: live sync on restic repositories"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
opendal.workspace = true
tokio.workspace = true
rustic_core.workspace = true
rustic_backend.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
sha2.workspace = true
crypto_box.workspace = true
hex.workspace = true
log.workspace = true
bytes = "1"
ignore.workspace = true
libc.workspace = true
rayon.workspace = true
diffy = "0.5.2"
hmac = "0.12"
# rustic_core's pack size settings take its ByteSize
bytesize = "2"
ureq = "3.4.2"
# Chromium's search engines live in SQLite (`Web Data`); bundled, so no
# system library is needed
rusqlite = { version = "0.37", features = ["bundled"] }
# Chromium's bookmarks checksum is MD5 (bookmark_codec.cc)
md-5 = "0.11"
# Codex's config.toml loses its machine-only tables keeping the rest as
# written (comments, order)
toml_edit = "0.25"

[dev-dependencies]
serde_json.workspace = true
env_logger.workspace = true
tempfile.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
hex.workspace = true
