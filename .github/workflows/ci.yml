name: ci

# Every push runs bin/check, the same checks a change passes locally. A release (scripts/release-ci.sh) starts the
# workflow itself, and then it also tests on a native ARM runner and builds the packages.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Arch, as the computers Omacloud runs on: its gtk4 has the broadway display the app's QA is drawn on, and its
    # quickshell runs the bar widget.
    container: archlinux:latest
    timeout-minutes: 60
    steps:
      # Beyond the build: jq and gtk4 (gtk4-broadwayd) for the app's QA, with a font, since the image has none and
      # GTK warns of text it cannot draw, which fails the QA; restic for the plain restore, which bin/check fails
      # without; quickshell and qt6-declarative (qmllint) for the bar widget; util-linux's `script` and curl for the
      # checks on a stand-in bucket; nodejs and npm for the Worker; libarchive's bsdtar and unzip for the packaging tests.
      - run: >
          pacman -Syu --noconfirm --needed base-devel git rust gtk4 ttf-dejavu jq restic quickshell qt6-declarative
          python nodejs npm curl util-linux libarchive unzip fuse3
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The checks run as an ordinary user, as the app does: the container's root ignores file permissions, which the
      # tests of files that can't be deleted rely on. The checkout, and the target the cache restored, become its own.
      - run: |
          useradd -m tester
          chown -R tester .
      - run: su tester -c bin/check
        env:
          CF_SEND_TELEMETRY: "false"

  arm:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo build --locked -p omacloud -p omacloud-app
      - run: cargo test --locked --workspace

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      # bash -n reads one script (the rest are its arguments), so one at a time
      - run: for f in install.sh pkgbuild/PKGBUILD packaging/omarchy-pkgs/omacloud/PKGBUILD scripts/*.sh .githooks/pre-push server/deploy.sh; do bash -n "$f"; done
      - run: for t in scripts/tests/*.py; do python3 "$t"; done

  packages:
    if: github.event_name == 'workflow_dispatch'
    needs: packaging
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-latest
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: target/package-cache/${{ matrix.architecture }}
          key: native-${{ matrix.architecture }}-${{ hashFiles('Cargo.lock', 'pkgbuild/PKGBUILD') }}
          restore-keys: |
            native-${{ matrix.architecture }}-
      - name: Prepare Arch Linux ARM image
        if: matrix.architecture == 'aarch64'
        run: |
          curl -fL --retry 3 https://ca.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz -o "$RUNNER_TEMP/arch-arm.tar.gz"
          docker import --platform linux/arm64 "$RUNNER_TEMP/arch-arm.tar.gz" omacloud-arch-arm
      - name: Build and check native package
        env:
          ARM_VERIFY_IMAGE: omacloud-arch-arm
          BUILD_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          scripts/build-package.sh "$BUILD_ARCHITECTURE" "$version" "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        with:
          name: omacloud-${{ matrix.architecture }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # types from cloudflare.config.ts, the type check and the unit tests
      - run: npm run check
        env:
          CF_SEND_TELEMETRY: "false"
