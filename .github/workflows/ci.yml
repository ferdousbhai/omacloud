name: ci

# Started by scripts/release-ci.sh for a release; changes are checked locally by bin/check.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - name: Restore with plain restic
        run: |
          sudo apt-get install -y restic
          cargo build --locked -p omacloud
          scripts/restic-compat.sh target/debug/omacloud

  arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo build --locked -p omacloud -p omacloud-app
      - run: cargo test --locked --workspace

  packaging:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      # bash -n reads one script (the rest are its arguments), so one at a time
      - run: for f in install.sh pkgbuild/PKGBUILD packaging/omarchy-pkgs/omacloud/PKGBUILD scripts/*.sh .githooks/pre-push contrib/seed-setup.sh server/deploy.sh server/backup.sh; do bash -n "$f"; done
      - run: for t in scripts/tests/*.py; do python3 "$t"; done

  packages:
    needs: packaging
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-latest
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/cache@v4
        with:
          path: target/package-cache/${{ matrix.architecture }}
          key: native-${{ matrix.architecture }}-${{ hashFiles('Cargo.lock', 'pkgbuild/PKGBUILD') }}
          restore-keys: |
            native-${{ matrix.architecture }}-
      - name: Prepare Arch Linux ARM image
        if: matrix.architecture == 'aarch64'
        run: |
          curl -fL --retry 3 https://ca.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz -o "$RUNNER_TEMP/arch-arm.tar.gz"
          docker import --platform linux/arm64 "$RUNNER_TEMP/arch-arm.tar.gz" omacloud-arch-arm
      - name: Build and check native package
        env:
          ARM_VERIFY_IMAGE: omacloud-arch-arm
          BUILD_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          scripts/build-package.sh "$BUILD_ARCHITECTURE" "$version" "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        with:
          name: omacloud-${{ matrix.architecture }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # types from cloudflare.config.ts, the type check and the unit tests
      - run: npm run check
        env:
          CF_SEND_TELEMETRY: "false"
