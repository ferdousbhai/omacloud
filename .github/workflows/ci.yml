name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Restore with plain restic
        run: |
          sudo apt-get install -y restic
          cargo build -p omacloud
          scripts/restic-compat.sh target/debug/omacloud
      - name: Sync through S3 (SeaweedFS)
        env:
          S3_ENDPOINT: http://localhost:8333
          S3_BUCKET: omacloud-ci
          S3_KEY: ci
          S3_SECRET: ci-secret
        run: |
          echo '{"identities":[{"name":"ci","credentials":[{"accessKey":"ci","secretKey":"ci-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}' > /tmp/s3.json
          docker run -d --name s3 -p 8333:8333 -v /tmp/s3.json:/etc/s3.json:ro \
            chrislusf/seaweedfs server -s3 -s3.config=/etc/s3.json -dir=/data
          for i in $(seq 1 60); do curl -s -o /dev/null localhost:8333 && break; sleep 1; done
          curl -sf -X PUT --aws-sigv4 "aws:amz:us-east-1:s3" --user ci:ci-secret "$S3_ENDPOINT/$S3_BUCKET"
          scripts/s3-sync.sh target/debug/omacloud
      - name: Bucket key change, one computer offline
        run: scripts/bucket-key.sh target/debug/omacloud

  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libadwaita-1-dev
      - run: cargo build --locked -p omacloud -p omacloud-app
      - run: cargo test --locked --workspace

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: bash -n install.sh pkgbuild/PKGBUILD scripts/build-package.sh scripts/release.sh scripts/release-ci.sh scripts/verify-release.sh
      - run: python3 scripts/tests/installer.py
      - run: python3 scripts/tests/release.py
      - run: python3 scripts/tests/release-ci.py
      - run: python3 scripts/tests/verify-release.py

  packages:
    needs: packaging
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-latest
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Prepare Arch Linux ARM image
        if: matrix.architecture == 'aarch64'
        run: |
          curl -fL --retry 3 https://ca.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz -o "$RUNNER_TEMP/arch-arm.tar.gz"
          docker import --platform linux/arm64 "$RUNNER_TEMP/arch-arm.tar.gz" omacloud-arch-arm
      - name: Build and check native package
        env:
          ARM_VERIFY_IMAGE: omacloud-arch-arm
          BUILD_ARCHITECTURE: ${{ matrix.architecture }}
        run: |
          version=$(sed -n 's/^version = "\([0-9.]*\)"$/\1/p' Cargo.toml)
          scripts/build-package.sh "$BUILD_ARCHITECTURE" "$version" "$RUNNER_TEMP/package"
      - uses: actions/upload-artifact@v4
        with:
          name: omacloud-${{ matrix.architecture }}
          path: ${{ runner.temp }}/package/
          if-no-files-found: error

  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      # types from cloudflare.config.ts, the type check and the unit tests
      - run: npm run check
        env:
          CF_SEND_TELEMETRY: "false"
